[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-juridico-poc"
version = "0.1.0"
description = "Assistente jurídico com RAG: cita o artigo-fonte, recusa sem base e mede alucinação."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
